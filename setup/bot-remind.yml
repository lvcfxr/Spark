# Раз в день бот пишет тем, кто не занимался 7 или 30 дней (по одному сообщению на каждый срок; включается и выключается в настройках и командой /remind).
# Нужны те же секреты, что для новостей: SPARK_BOT_URL и SPARK_BOT_SECRET. Без них ничего не делает.
name: Bot — напоминания
on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Напомнить
        env:
          BOT_URL: ${{ secrets.SPARK_BOT_URL }}
          BOT_SECRET: ${{ secrets.SPARK_BOT_SECRET }}
        run: |
          if [ -z "$BOT_URL" ] || [ -z "$BOT_SECRET" ]; then echo "Секреты бота не заданы — пропускаю"; exit 0; fi
          curl -fsS -X POST "$BOT_URL?action=remind" -H "x-admin-secret: $BOT_SECRET"
