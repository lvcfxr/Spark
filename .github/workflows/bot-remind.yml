# Каждый час бот проверяет: кому пора напомнить о занятиях (через 7 и 30 дней без занятий) и кому прислать «слово дня».
# Тихие часы и часовой пояс учитываются для каждого человека отдельно. Нужны секреты репозитория SPARK_BOT_URL и SPARK_BOT_SECRET; без них ничего не делает.
name: Bot — напоминания и слово дня
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Напоминания и слово дня
        env:
          BOT_URL: ${{ secrets.SPARK_BOT_URL }}
          BOT_SECRET: ${{ secrets.SPARK_BOT_SECRET }}
        run: |
          if [ -z "$BOT_URL" ] || [ -z "$BOT_SECRET" ]; then echo "Секреты бота не заданы — пропускаю"; exit 0; fi
          curl -fsS -X POST "$BOT_URL?action=remind" -H "x-admin-secret: $BOT_SECRET"; echo
          curl -fsS -X POST "$BOT_URL?action=word" -H "x-admin-secret: $BOT_SECRET"
